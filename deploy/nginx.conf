# /etc/nginx/sites-available/zeroclaw
# Zero-downtime reverse proxy for ZeroClaw Next.js app.
# Symlink: ln -s /etc/nginx/sites-available/zeroclaw /etc/nginx/sites-enabled/zeroclaw

upstream zeroclaw_app {
    server 127.0.0.1:3000;
    keepalive 64;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name zeroclaw.com www.zeroclaw.com;
    return 301 https://$host$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zeroclaw.com www.zeroclaw.com;

    # SSL — replace with actual cert paths (e.g. Let's Encrypt / Certbot)
    ssl_certificate     /etc/letsencrypt/live/zeroclaw.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zeroclaw.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # Logging
    access_log /var/log/nginx/zeroclaw.access.log combined buffer=16k flush=5s;
    error_log  /var/log/nginx/zeroclaw.error.log warn;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml font/woff font/woff2;

    # Client settings
    client_max_body_size 10m;
    client_body_timeout  30s;
    send_timeout         30s;

    # Static assets (Next.js _next/static) — long cache
    location /_next/static/ {
        alias /var/www/zeroclaw/current/.next/static/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Public assets
    location /public/ {
        alias /var/www/zeroclaw/current/public/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Generated games (longer cache — games don't change once generated)
    location /games/generated/ {
        alias /var/www/zeroclaw/current/public/games/generated/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options nosniff;
    }

    # SSE routes — no buffering, no timeout
    location ~ ^/api/(commits|stats|events)/ {
        proxy_pass         http://zeroclaw_app;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SSE: disable buffering
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 86400s;  # 24h — SSE connections are long-lived
        chunked_transfer_encoding on;

        add_header Cache-Control "no-cache, no-transform";
        add_header X-Accel-Buffering no;
    }

    # TimeWarp previews — proxy to dynamic ports
    # Individual preview ports are managed by TimeWarpServer (4000-4099)
    location /timewarp/ {
        proxy_pass         http://127.0.0.1:4000/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 60s;

        # Note: Dynamic port routing should be handled at app level
        # This is a placeholder for the default timewarp preview port
    }

    # Admin routes — restrict to local or VPN IPs in production
    location /api/admin/ {
        # Uncomment and adjust to restrict admin API:
        # allow 127.0.0.1;
        # allow 10.0.0.0/8;
        # deny all;

        proxy_pass         http://zeroclaw_app;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;  # 5 min for slow admin operations
    }

    # All other routes → Next.js app
    location / {
        proxy_pass         http://zeroclaw_app;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;

        # Cache HTML pages briefly (5 min)
        proxy_cache_valid 200 5m;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Health check endpoint (no logging)
    location /api/health {
        proxy_pass http://zeroclaw_app;
        access_log off;
    }

    # Favicon
    location = /favicon.ico {
        alias /var/www/zeroclaw/current/public/favicon.ico;
        access_log off;
        expires 30d;
    }

    # robots.txt
    location = /robots.txt {
        alias /var/www/zeroclaw/current/public/robots.txt;
        access_log off;
    }
}
