# /etc/logrotate.d/zeroclaw
# Log rotation for ZeroClaw application and scheduler logs.
# Place this file at: /etc/logrotate.d/zeroclaw

/var/log/zeroclaw/*.log {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    sharedscripts
    copytruncate

    postrotate
        # Send SIGHUP to app to reopen log files (if using file transport)
        if [ -f /var/www/zeroclaw/scheduler.pid ]; then
            kill -HUP $(cat /var/www/zeroclaw/scheduler.pid) 2>/dev/null || true
        fi
    endscript
}

/var/log/nginx/zeroclaw*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    sharedscripts

    postrotate
        nginx -s reopen 2>/dev/null || true
    endscript
}
